name: Ежедневная генерация статей

on:
  schedule:
    - cron: "0 9 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm install
      - name: Генерация статей
        env:
          CF_AI_WORKER_URL: ${{ secrets.CF_AI_WORKER_URL }}
          CF_AI_WORKER_KEY: ${{ secrets.CF_AI_WORKER_KEY }}
          DEEPINFRA_API_KEY: ${{ secrets.DEEPINFRA_API_KEY }}
          IMGBB_API_KEY: ${{ secrets.IMGBB_API_KEY }}
        run: npm run generate
      - name: Коммит новых статей
        run: |
          git config user.name "content-bot"
          git config user.email "content-bot@users.noreply.github.com"
          git add sites/
          git diff --staged --quiet || git commit -m "Автогенерация статей: $(date -u +'%Y-%m-%d')"
          git push
