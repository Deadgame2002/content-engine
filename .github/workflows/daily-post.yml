name: Ежедневная генерация статей

on:
  schedule:
    # Каждый день в 9:00 по UTC (12:00 по Риге зимой / 11:00 летом — поправь при желании)
    - cron: "0 9 * * *"
  workflow_dispatch: {} # позволяет запускать вручную кнопкой в GitHub

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Скачать репозиторий
        uses: actions/checkout@v4

      - name: Установить Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Установить зависимости
        run: npm install

      - name: Запустить генерацию статей
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          CF_AI_WORKER_URL: ${{ secrets.CF_AI_WORKER_URL }}
          CF_AI_WORKER_KEY: ${{ secrets.CF_AI_WORKER_KEY }}
          IMGBB_API_KEY: ${{ secrets.IMGBB_API_KEY }}
        run: npm run generate

      - name: Закоммитить и запушить новые статьи
        run: |
          git config user.name "content-bot"
          git config user.email "content-bot@users.noreply.github.com"
          git add sites/
          git diff --staged --quiet || git commit -m "Автогенерация статей: $(date -u +'%Y-%m-%d')"
          git push
