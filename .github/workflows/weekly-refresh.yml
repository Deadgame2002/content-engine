name: Еженедельное обновление старых статей

on:
  schedule:
    - cron: "0 10 * * 1"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm install
      - name: Обновление старых статей
        env:
          CF_AI_WORKER_URL: ${{ secrets.CF_AI_WORKER_URL }}
          CF_AI_WORKER_KEY: ${{ secrets.CF_AI_WORKER_KEY }}
          REFRESH_POSTS_PER_SITE: "1"
        run: npm run refresh
      - name: Коммит обновлений
        run: |
          git config user.name "content-bot"
          git config user.email "content-bot@users.noreply.github.com"
          git add sites/
          git diff --staged --quiet || git commit -m "Автообновление старых статей: $(date -u +'%Y-%m-%d')"
          git push
