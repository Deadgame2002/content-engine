name: Еженедельное обновление старых статей

on:
  schedule:
    # Каждый понедельник в 10:00 UTC
    - cron: "0 10 * * 1"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Скачать репозиторий
        uses: actions/checkout@v4

      - name: Установить Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Установить зависимости
        run: npm install

      - name: Обновить старые статьи
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          REFRESH_POSTS_PER_SITE: "1"
        run: npm run refresh

      - name: Закоммитить и запушить обновления
        run: |
          git config user.name "content-bot"
          git config user.email "content-bot@users.noreply.github.com"
          git add sites/
          git diff --staged --quiet || git commit -m "Автообновление старых статей: $(date -u +'%Y-%m-%d')"
          git push
